<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <div class="container">
            <h2>Gerador de Números</h2>

            <div class="input-group">
                <div class="input-field">
                    <label for="min">Mín:</label>
                    <input id="min" type="text" inputmode="numeric" pattern="[0-9]*" name="min">
                </div>

                <div class="input-field">
                    <label for="max">Máx:</label>
                    <input id="max" type="text" inputmode="numeric" pattern="[0-9]*" name="max">
                </div>
            </div>

            <button id="generate">Gerar</button>

            <div id="result">
                <span>
                    00
                </span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>>
